const STORE = "wn-key";
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const toB64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));

async function open(rawKey) {
  const key = await crypto.subtle.importKey("raw", rawKey, "AES-GCM", false, ["decrypt"]);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.i) }, key, b64(P.c)));
  // While this page is still parsing, document.write() appends instead of replacing it.
  if (document.readyState === "loading") await new Promise((r) => document.addEventListener("DOMContentLoaded", r, { once: true }));
  document.open(); document.write(html); document.close();
}

async function derive(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return crypto.subtle.deriveBits({ name: "PBKDF2", salt: b64(P.s), iterations: P.n, hash: "SHA-256" }, base, 256);
}

(async () => {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE) || "null");
    if (saved && saved.s === P.s) await open(b64(saved.k));
  } catch { try { localStorage.removeItem(STORE); } catch {} }
})();

document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const go = document.getElementById("go"), err = document.getElementById("err");
  go.disabled = true; go.textContent = "Unlocking…"; err.textContent = "";
  try {
    const remember = document.getElementById("rem").checked; // read before open() replaces the page
    const raw = await derive(document.getElementById("pw").value);
    await open(raw);
    if (remember) {
      try { localStorage.setItem(STORE, JSON.stringify({ s: P.s, k: toB64(raw) })); } catch {}
    }
  } catch {
    err.textContent = "That password didn't work.";
    go.disabled = false; go.textContent = "Unlock";
  }
});
})();
